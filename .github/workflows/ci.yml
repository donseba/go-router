name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -coverprofile=coverage.out ./...
      - run: go test -race ./...
      - run: go vet ./...
      - uses: codecov/codecov-action@v7
        with:
          files: coverage.out
          use_oidc: true
